<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate - 首页</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- 顶部 -->
    <header>
        <h1>StudyMate</h1>
        <p>校园课程与学习任务管理助手</p>
    </header>


    <!-- 首页内容 -->
    <main>

    <!-- 今日学习概览 -->
    <section class="study-overview">


    <h2 id="greeting">早上好 👋</h2>

    <p id="rest-reminder"></p>

    <div class="date-info">
        <p id="today-date">今日</p>
        <span id="week-info"></span>
    </div>

    <div class="overview-card">

        <div class="overview-item">
            <span>📚 今日课程</span>
            <strong id="today-courses">0节课</strong>
        </div>

        <div class="overview-item">
            <span>✅ 任务</span>
            <strong id="task-progress">已完成0/0</strong>
        </div>

        <div class="overview-item">
            <span>⏱️ 专注</span>
            <strong id="focus-minutes">0分钟</strong>
        </div>

    </div>

</section>

        <section>
            <h2>你好！</h2>
            <p>开始今天的学习吧。</p>
        </section>


        <section>
            <h2>今日课程</h2>
            <div id="today-course-list">
            <p>暂时没有课程数据</p>
        </div>
        </section>


        <section>
            <h2>今日任务</h2>
            <div id="today-task-list">
            <p>暂时没有学习任务</p>
        </div>
        </section>


        <section>
            <h2>今日专注</h2>
            <p>今日专注时间：<strong id="today-focus-minutes">0</strong> 分钟</p>
        </section>

    </main>


    <!-- 底部导航栏 -->
    <nav>
        <a href="index.html" class="active">首页</a>
        <a href="course.html">课程</a>
        <a href="task.html">任务</a>
        <a href="focus.html">专注</a>
        <a href="profile.html">我的</a>
    </nav>

    <script src="js/timer.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // ================================
            // 根据时间自动显示问候语
            // ================================

const currentHour = new Date().getHours();

const greetingElement =
    document.getElementById('greeting');

const restReminder =
    document.getElementById('rest-reminder');


// 早上 5:00 - 11:59
if (currentHour >= 5 && currentHour < 12) {

    greetingElement.textContent =
        '早上好👋';

    restReminder.textContent = '';


// 下午 12:00 - 17:59
} else if (currentHour >= 12 && currentHour < 18) {

    greetingElement.textContent =
        '下午好☀️';

    restReminder.textContent = '';


// 晚上 18:00 - 第二天 4:59
} else {

    greetingElement.textContent =
        '晚上好🌙';

    restReminder.textContent =
        '今天辛苦了，记得早点休息。';

}

// ================================
// 自动显示今天日期
// ================================

const currentDate = new Date();

const weekDays = [
    '星期日',
    '星期一',
    '星期二',
    '星期三',
    '星期四',
    '星期五',
    '星期六'
];

const months = [
    '1月',
    '2月',
    '3月',
    '4月',
    '5月',
    '6月',
    '7月',
    '8月',
    '9月',
    '10月',
    '11月',
    '12月'
];


// 星期
const weekDay =
    weekDays[currentDate.getDay()];

// 月份
const month =
    months[currentDate.getMonth()];

// 日期
const date =
    currentDate.getDate();


// 显示完整日期
document.getElementById('today-date').textContent =
    month +  date + '日' + weekDay;


// ================================
// 计算今年第几周
// ================================

const startOfYear =
    new Date(currentDate.getFullYear(), 0, 1);

const daysPassed =
    Math.floor(
        (currentDate - startOfYear) /
        (24 * 60 * 60 * 1000)
    );

const weekNumber =
    Math.ceil(
        (daysPassed + startOfYear.getDay() + 1) / 7
    );


// 显示 Week
document.getElementById('week-info').textContent =
    '今天 · 第 ' + weekNumber + ' 周';

            // 读取课程页面保存的所有课程
            const courses = JSON.parse(localStorage.getItem('courses')) || [];

            // 获取今天是星期几
            // 周日=0，周一=1，周二=2……周六=6
            const today = new Date().getDay();

            // 找出今天的课程
            const todayCourses = courses.filter(function(course) {
                return course.day === today;
            });

            // 把今天课程数量显示到首页
            const courseElement = document.getElementById('today-courses');

            if (courseElement) {
                courseElement.textContent =
                    todayCourses.length + ' 节课';
            }

            // ================================
// 显示今天的具体课程
// ================================

const todayCourseList =
    document.getElementById('today-course-list');

if (todayCourseList) {

    if (todayCourses.length === 0) {

        todayCourseList.innerHTML =
            '<p>今天没有课程。</p>';

    } else {

        // 按上课时间排序
        todayCourses.sort(function(a, b) {
            return a.start.localeCompare(b.start);
        });

        todayCourseList.innerHTML =
            todayCourses.map(function(course) {

                return `
                    <div class="course-card">

                        <div class="course-time">
                            ${course.start} - ${course.end}
                        </div>

                        <div class="course-name">
                            ${course.name}
                        </div>

                        <div class="course-location">
                            📍 ${course.location}
                        </div>

                    </div>
                `;

            }).join('');
    }
}

            // ================================
            // 读取任务数据
            // ================================

            const tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // 统计已经完成的任务
            const completedTasks = tasks.filter(function(task) {
            return task.completed === true;
        });

        // 找到首页的任务统计位置
            const taskElement = document.getElementById('task-progress');

        // 显示：完成数量 / 总任务数量
        if (taskElement) {
            taskElement.textContent =
            '已完成' + completedTasks.length + ' / ' + tasks.length;
            }

        // ================================
// 显示任务列表
// ================================

const todayTaskList =
    document.getElementById('today-task-list');

if (todayTaskList) {

    if (tasks.length === 0) {

        todayTaskList.innerHTML =
            '<p>暂时没有学习任务。</p>';

    } else {

        todayTaskList.innerHTML =
            tasks.map(function(task) {

                const status =
                    task.completed ? '✅' : '🟩';

                return `
                    <p>
                        ${status} ${task.name}
                    </p>
                `;

            }).join('');
    }
}

    // ================================
// 读取专注数据
// ================================

const focusSessions =
    JSON.parse(localStorage.getItem('focusSessions')) || [];


// 获取今天日期
const now = new Date();

const todayString =
    now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');


// 找出今天完成的番茄钟
const todaySessions = focusSessions.filter(function(session) {
    return session.date === todayString;
});


// 计算今天总专注分钟数
const todayFocusMinutes = todaySessions.reduce(function(total, session) {
    return total + session.minutes;
}, 0);


// 首页顶部 Focus
const focusElement =
    document.getElementById('focus-minutes');

if (focusElement) {
    focusElement.textContent =
        todayFocusMinutes + ' 分钟';
}


// 首页下面“今日专注”
const todayFocusElement =
    document.getElementById('today-focus-minutes');

if (todayFocusElement) {
    todayFocusElement.textContent =
        todayFocusMinutes;
}

        });
    </script>

</body>

</html>
